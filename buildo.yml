name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - основной

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP archive
        run: |
          if [ ! -f capsule.zip ]; then
            echo "ERROR: capsule.zip not found"
            ls -la
            exit 1
          fi

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -o capsule.zip -d source
          find source -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find Android project
        id: project
        run: |
          FILE=$(find source -name settings.gradle.kts -print -quit)
          if [ -z "$FILE" ]; then
            FILE=$(find source -name settings.gradle -print -quit)
          fi
          if [ -z "$FILE" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
